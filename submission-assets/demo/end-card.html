<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MCP Queen — Find. Verify. Connect.</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      color: #fffaf0;
      background:
        radial-gradient(circle at 50% 40%, rgba(132, 74, 190, .3), transparent 34%),
        linear-gradient(145deg, #08030e 0%, #180725 55%, #09030f 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(1480px, 86vw); text-align: center; }
    .eyebrow { color: #ffc85d; font-size: clamp(24px, 2vw, 38px); font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
    h1 { margin: 22px 0 34px; font-size: clamp(78px, 8vw, 142px); line-height: 1; letter-spacing: -.055em; }
    .url { margin: 0; font-size: clamp(38px, 4vw, 68px); font-weight: 680; }
    .endpoint { margin: 22px 0 0; color: #c8b9d7; font: clamp(21px, 1.7vw, 32px)/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .note { margin: 55px 0 0; color: #a99ab9; font-size: clamp(18px, 1.3vw, 25px); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">The evidence layer for MCP</p>
    <h1>Find. Verify. Connect.</h1>
    <p class="url">mcpqueen.com</p>
    <p class="endpoint">https://mcpqueen.com/mcp</p>
    <p class="note">Operational evidence, not a security certification.</p>
  </main>
</body>
</html>

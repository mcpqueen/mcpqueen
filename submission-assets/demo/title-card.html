<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MCP Queen — OpenAI demo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      color: #fffaf0;
      background:
        radial-gradient(circle at 50% 32%, rgba(132, 74, 190, .34), transparent 30%),
        linear-gradient(145deg, #08030e 0%, #180725 55%, #09030f 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(1420px, 82vw); text-align: center; }
    img {
      width: min(220px, 19vh);
      height: min(220px, 19vh);
      border-radius: 25%;
      box-shadow: 0 22px 90px rgba(0, 0, 0, .55), 0 0 72px rgba(215, 159, 70, .17);
    }
    h1 { margin: 28px 0 10px; font-size: clamp(68px, 7vw, 124px); line-height: .95; letter-spacing: -.055em; }
    .tagline { margin: 34px auto 0; max-width: 1250px; font-size: clamp(34px, 3.2vw, 58px); line-height: 1.13; letter-spacing: -.025em; }
    .tagline strong { color: #ffc85d; font-weight: 760; }
    .meta { margin-top: 35px; color: #c8b9d7; font-size: clamp(20px, 1.55vw, 29px); letter-spacing: .02em; }
  </style>
</head>
<body>
  <main>
    <img src="../mcpqueen-directory-icon.png" alt="">
    <h1>MCP Queen</h1>
    <p class="tagline">Don't connect your AI agent to a stranger.<br><strong>Verify it first.</strong></p>
    <p class="meta">Evidence-based MCP discovery · Live operational grades · Trust Receipts</p>
  </main>
</body>
</html>
